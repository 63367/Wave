<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave - Connexion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1dc8f0 0%, #0aa8d6 100%);
  }

  .card {
    background: #fff;
    width: 100%;
    max-width: 380px;
    border-radius: 24px;
    padding: 40px 32px;
    box-shadow: 0 20px 60px rgba(0, 60, 90, .25);
    text-align: center;
  }

  .logo {
    width: 72px; height: 72px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1dc8f0, #0aa8d6);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 32px; font-weight: bold;
    box-shadow: 0 6px 18px rgba(29, 200, 240, .4);
  }

  .brand {
    font-size: 30px;
    font-weight: 900;
    color: #1dc8f0;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  h1 { font-size: 20px; color: #123; margin-bottom: 6px; }
  p.sub { color: #7a8fa0; font-size: 14px; margin-bottom: 28px; }

  .steps { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
  .step { width: 28px; height: 5px; border-radius: 3px; background: #e4eef3; transition: background .3s; }
  .step.active { background: #1dc8f0; }

  .field { text-align: left; margin-bottom: 20px; }
  .field label { display: block; font-size: 13px; color: #5a6b78; margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e4eef3;
    border-radius: 14px;
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
    text-align: center;
    letter-spacing: 2px;
  }
  .field input:focus { border-color: #1dc8f0; }

  .btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #1dc8f0, #0aa8d6);
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 8px 20px rgba(29, 200, 240, .35);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(29, 200, 240, .45); }

  .back {
    margin-top: 14px;
    background: none; border: none; color: #7a8fa0;
    font-size: 14px; cursor: pointer; text-decoration: underline;
  }

  .screen { display: none; }
  .screen.visible { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

  .code-inputs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .code-inputs input {
    width: 52px; height: 60px;
    text-align: center; font-size: 24px; font-weight: bold;
    border: 2px solid #e4eef3; border-radius: 14px; outline: none;
    transition: border-color .2s;
  }
  .code-inputs input:focus { border-color: #1dc8f0; }

  .resend { font-size: 13px; color: #7a8fa0; margin-bottom: 20px; }
  .resend a { color: #0aa8d6; font-weight: 600; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">W</div>
    <div class="brand">Wave</div>
    <p class="sub">L'argent mobile, simple et rapide</p>

    <div class="steps">
      <div class="step active" id="s1"></div>
      <div class="step" id="s2"></div>
      <div class="step" id="s3"></div>
    </div>

    <!-- ÉTAPE 1 : Numéro de téléphone -->
    <div class="screen visible" id="screen1">
      <h1>Bienvenue</h1>
      <p class="sub">Entre ton numéro de téléphone</p>
      <div class="field">
        <label for="tel">Numéro de téléphone</label>
        <input type="tel" id="tel" placeholder="+221 77 123 45 67" required>
      </div>
      <button class="btn" onclick="goStep(2)">Suivant</button>
    </div>

    <!-- ÉTAPE 2 : Code PIN -->
    <div class="screen" id="screen2">
      <h1>Code secret</h1>
      <p class="sub">Entre ton code PIN</p>
      <div class="field">
        <input type="password" id="pin" placeholder="••••" maxlength="4" inputmode="numeric">
      </div>
      <button class="btn" onclick="goStep(3)">Suivant</button>
      <button class="back" onclick="goStep(1)">← Retour</button>
    </div>

    <!-- ÉTAPE 3 : Code de vérification -->
    <div class="screen" id="screen3">
      <h1>Vérification</h1>
      <p class="sub">Entre le code à 4 chiffres envoyé par SMS</p>
      <div class="code-inputs">
        <input type="text" maxlength="1" inputmode="numeric" oninput="moveNext(this)">
        <input type="text" maxlength="1" inputmode="numeric" oninput="moveNext(this)">
        <input type="text" maxlength="1" inputmode="numeric" oninput="moveNext(this)">
        <input type="text" maxlength="1" inputmode="numeric">
      </div>
      <p class="resend">Tu n'as rien reçu ? <a onclick="alert('Démo : nouveau code envoyé !')">Renvoyer le code</a></p>
      <button class="btn" onclick="finish()">Se connecter</button>
      <button class="back" onclick="goStep(2)">← Retour</button>
    </div>
  </div>

<script>
  function goStep(n) {
    for (let i = 1; i <= 3; i++) {
      document.getElementById('screen' + i).classList.toggle('visible', i === n);
      document.getElementById('s' + i).classList.toggle('active', i <= n);
    }
    const input = document.querySelector('#screen' + n + ' input');
    if (input) input.focus();
  }

  function moveNext(el) {
    el.value = el.value.replace(/\D/g, '');
    if (el.value.length === 1 && el.nextElementSibling) {
      el.nextElementSibling.focus();
    }
  }

  function finish() {
    alert('Démo : connexion validée ! Connecte ça à ton backend.');
  }
</script>
</body>
</html>
